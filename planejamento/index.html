<title>Planejamento de Elenco</title>
<!-- Planejamento de Elenco (Scout System) — 26/10/2026, pedido do Brunno.
     Ideia vista num planejador público de elencos; aqui é a versão própria do Botafogo (desenho, nomes e dados nossos).
     Elenco por setor com Fica / Sai (venda, empréstimo, fim de contrato) / Chega, contratações (busca no SofaScore,
     mais minutos na liga, Indicados e Debatidos do Scout System ou à mão) e a escalação 2027 com reservas.
     Dados: SofaScore pela extensão BFR Relatório Jogadores (pedido 'baixar'). Decisões salvas no Firebase do
     Scout System (planejador/<id do clube>), iguais para a equipe toda. Fotos guardadas em planejador_fotos. -->

</script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#15161a;--ink2:#1f2127;--ink3:#2a2d35;--line:#33363f;--txt:#eef0f4;--txt2:#a9aebb;--txt3:#6f7482;
  --gold:#e8c84a;--fica:#1f9d55;--sai:#d64545;--chega:#e8c84a;--cond:'Barlow Condensed',Arial,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--ink);color:var(--txt);font:13px -apple-system,BlinkMacSystemFont,'Helvetica Neue',Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,select,input{font:inherit}
.extra{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12px}
.extra:empty{display:none}
.dica{cursor:help;color:var(--txt3);font-size:14px}
.barra .dir{margin-left:auto;flex-wrap:nowrap}
.barra{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 16px;background:var(--ink2);border-bottom:1px solid var(--line)}
.barra select{background:var(--ink3);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.seg{display:flex;background:var(--ink3);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{background:none;border:0;color:var(--txt2);padding:5px 14px;border-radius:7px;cursor:pointer;font-weight:600}
.seg button.on{background:var(--gold);color:var(--ink)}
.btn{background:var(--ink3);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer;font-weight:600;font-size:12px;white-space:nowrap}
.btn:hover{border-color:#555a66}
.btn.ouro{background:var(--gold);color:var(--ink);border-color:var(--gold)}
.dir{margin-left:auto;display:flex;gap:8px;align-items:center}
.info{color:var(--txt3);font-size:11.5px}
.aviso{background:#3a3214;color:#f3e3a0;border-bottom:1px solid #5a4c1c;padding:7px 16px;font-size:12.5px}
.aviso a{color:var(--gold)}
#log{color:var(--txt3);font-size:11.5px;padding:3px 16px}
#log:empty{display:none}
main{padding:4px 16px 40px;max-width:1900px;margin:0 auto}
body.campo main{max-width:none;padding:6px 10px 6px}
/* cabeçalho do clube */
.clube{display:flex;align-items:center;gap:14px;margin:6px 0 12px;flex-wrap:wrap}
.clube img{width:58px;height:58px;object-fit:contain}
.clube h1{font-family:var(--cond);font-size:38px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;line-height:1}
.clube h1 span{color:var(--gold)}
.clube .sub{color:var(--txt3);font-size:12px;margin-top:3px}
.conts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.cont{background:var(--ink2);border:1px solid var(--line);border-radius:10px;padding:7px 12px;min-width:84px}
.cont b{display:block;font-family:var(--cond);font-size:30px;line-height:1}
.cont small{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--txt3)}
.cont.f b{color:var(--fica)}.cont.s b{color:var(--sai)}.cont.c b{color:var(--chega)}.cont.d b{color:var(--txt2)}.cont.t{border-color:var(--gold)}.cont.t b{color:#fff}
/* setores */
.setor{background:var(--ink2);border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden}
.setor-cab{display:flex;align-items:baseline;gap:10px;padding:8px 14px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,rgba(232,200,74,.10),transparent 40%)}
.setor-cab h2{font-family:var(--cond);font-size:20px;font-weight:800;letter-spacing:1.5px;text-transform:uppercase}
.setor-cab .q{color:var(--txt2);font-size:12px}
.setor-cab .q b{color:#fff;font-size:14px}
.cards{display:flex;flex-wrap:wrap;gap:10px;padding:12px 14px}
.card{width:128px;background:var(--ink3);border:2px solid transparent;border-radius:11px;position:relative;display:flex;flex-direction:column;overflow:hidden}
.card.fica{border-color:var(--fica)}.card.sai{border-color:var(--sai);opacity:.82}.card.chega{border-color:var(--chega)}
.card .ft{width:100%;aspect-ratio:1/1;object-fit:cover;background:#3a3d46;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-size:34px;color:#8a8f9c}
.card .tag{position:absolute;top:6px;left:6px;font-family:var(--cond);font-weight:800;font-size:12px;letter-spacing:1px;padding:2px 7px;border-radius:5px}
.card.fica .tag{background:var(--fica);color:#fff}.card.sai .tag{background:var(--sai);color:#fff}.card.chega .tag{background:var(--chega);color:var(--ink)}
.card .mn{position:absolute;top:5px;right:5px;width:24px;height:24px;border-radius:6px;border:0;background:rgba(0,0,0,.55);color:#fff;cursor:pointer;font-size:14px;line-height:1}
.card .nm{padding:6px 7px 0;font-weight:700;font-size:12.5px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .dt{padding:1px 7px;color:var(--txt2);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .ct{padding:0 7px 4px;color:var(--txt3);font-size:10.5px}
.card .ct.alerta{color:#ff8a7a;font-weight:700}
.acoes{display:flex;gap:4px;padding:5px 6px 6px;margin-top:auto}
.acoes button{flex:1;border:1px solid var(--line);background:var(--ink2);color:var(--txt2);border-radius:6px;padding:4px 0;font-size:11px;font-weight:700;cursor:pointer}
.acoes button.f.on{background:var(--fica);border-color:var(--fica);color:#fff}
.acoes button.s.on{background:var(--sai);border-color:var(--sai);color:#fff}
.tipos{display:flex;padding:0 6px 7px}
.tipos select{width:100%;background:#4a1f1f;color:#ffd9d6;border:1px solid #7a2b2b;border-radius:6px;padding:4px 6px;font-size:11.5px;font-weight:700;cursor:pointer}
.tipos button{flex:1;min-width:0;letter-spacing:-.2px;border:1px solid #5a2a2a;background:transparent;color:#e3a3a3;border-radius:5px;padding:2px 0;font-size:9.5px;font-weight:700;cursor:pointer;text-transform:uppercase}
.tipos button.on{background:#7a2b2b;color:#fff}
.card.novo{border:2px dashed #4a4e59;background:transparent;align-items:center;justify-content:center;cursor:pointer;color:var(--txt3);min-height:200px;font-weight:700;letter-spacing:.08em;font-size:11px;gap:8px}
.card.novo:hover{border-color:var(--gold);color:var(--gold)}
.card.novo.inc{min-height:0;height:auto;padding:10px 4px;font-size:10px;text-align:center;border-color:#3a3d46}
.card.novo i{font-style:normal;font-size:30px;line-height:1}
/* menu do card */
.pop{position:fixed;z-index:80;background:#fff;color:#17181c;border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.45);padding:6px;min-width:190px;font-size:12.5px}
.pop button{display:block;width:100%;text-align:left;background:none;border:0;padding:6px 9px;border-radius:6px;cursor:pointer}
.pop button:hover{background:#f0f1f4}
.pop .t{font-size:10px;font-weight:700;letter-spacing:.08em;color:#8a8f9c;text-transform:uppercase;padding:6px 9px 2px}
.pop .vm{color:#c0392b}
/* janela de contratar */
.fundo{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.6);display:flex;align-items:flex-start;justify-content:center;padding:40px 12px;overflow:auto}
.jan{background:var(--ink2);border:1px solid var(--line);border-radius:14px;width:min(720px,100%);padding:16px}
.jan h3{font-family:var(--cond);font-size:26px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.jan h3 span{color:var(--gold)}
.jan .x{margin-left:auto;background:none;border:0;color:var(--txt2);font-size:22px;cursor:pointer}
.abas{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.abas button{white-space:nowrap}
.abas button{background:var(--ink3);border:1px solid var(--line);color:var(--txt2);padding:5px 11px;border-radius:999px;cursor:pointer;font-weight:600;font-size:12px}
.abas button.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.linha{display:flex;gap:8px;margin-bottom:8px}
.linha input,.linha select,.form input,.form select{flex:1;background:var(--ink3);color:var(--txt);border:1px solid var(--line);border-radius:8px;padding:8px 10px}
.res{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:4px}
.it{display:flex;align-items:center;gap:10px;padding:6px 8px;border-radius:9px;background:var(--ink3);cursor:pointer;border:1px solid transparent}
.it:hover{border-color:var(--gold)}
.it img,.it .sem{width:38px;height:38px;border-radius:8px;object-fit:cover;background:#3a3d46;flex:none}
.it .q{flex:1;min-width:0}
.it .q b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.it .q small{color:var(--txt2)}
.it .n{text-align:right;color:var(--txt2);font-size:11px}
.it .n b{display:block;color:#fff;font-size:15px}
.vaz{color:var(--txt3);padding:18px;text-align:center}
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.form label{display:flex;flex-direction:column;gap:3px;font-size:10.5px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--txt3)}
/* escalação */
.esc{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:14px;align-items:start}
#campoWrap{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;justify-content:center}
#campo{width:min(100%,calc((100vh - 150px) * 1.4));background:#101114;border-radius:10px;padding:14px 14px 10px;position:relative}
.gram{position:relative;width:100%;aspect-ratio:100/64;border:2px solid #2f333c;border-radius:6px;background:repeating-linear-gradient(90deg,#15171c 0 10%,#17191f 10% 20%)}
.gram .l{position:absolute;border:2px solid #2f333c}
.slot{position:absolute;transform:translate(-50%,-50%);width:104px;display:flex;flex-direction:column;align-items:center;gap:2px}
.slot .fto{width:50px;height:50px;border-radius:9px;object-fit:cover;background:#3a3d46;border:2px solid #fff;display:flex;align-items:center;justify-content:center;font-family:var(--cond);font-size:20px;color:#8a8f9c}
.slot .fto.chega{border-color:var(--gold)}
.slot .ti{background:#fff;color:#111;font-family:var(--cond);font-weight:800;font-size:13px;letter-spacing:.3px;padding:1px 6px;border-radius:4px;text-transform:uppercase;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
.slot .rs{font-size:9.5px;color:#c9ccd4;background:rgba(255,255,255,.07);padding:0 5px;border-radius:3px;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;text-transform:uppercase}
.rodape-campo{display:flex;align-items:center;justify-content:space-between;margin-top:8px;font-family:var(--cond);font-weight:800;letter-spacing:.5px;text-transform:uppercase}
.rodape-campo img{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px}
.rodape-campo span b{color:var(--gold)}
.painel{background:var(--ink2);border:1px solid var(--line);border-radius:12px;padding:12px}
.painel h4{font-size:10.5px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--txt3);margin:4px 0 8px}
.esqs{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px}
.esqs button{background:var(--ink3);border:1px solid var(--line);color:var(--txt2);border-radius:7px;padding:4px 9px;cursor:pointer;font-weight:700;font-size:12px}
.esqs button.on{background:var(--gold);border-color:var(--gold);color:var(--ink)}
.pos{display:grid;grid-template-columns:36px 1fr;gap:3px 6px;align-items:center;margin-bottom:7px}
.pos .p{font-weight:800;color:var(--gold);font-size:11px;grid-row:span 3}
.pos select{background:var(--ink3);color:var(--txt);border:1px solid var(--line);border-radius:6px;padding:3px 6px;font-size:12px}
.pos select.t{font-weight:700;padding:5px 6px}
.chk{display:flex;gap:6px;align-items:center;color:var(--txt2);font-size:12px;margin-bottom:6px}
@media (max-width:900px){.esc{grid-template-columns:1fr}.conts{margin-left:0}}
@media (max-width:520px){main{padding:4px 10px 30px}.card{width:calc(50% - 5px)}.slot{width:70px}.slot .fto{width:40px;height:40px}}

/* campograma */
.cg-barra{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:4px 0 4px}
.cg-leg{display:flex;align-items:center;gap:6px;color:var(--txt2);font-size:11.5px;flex-wrap:wrap}
.cg-leg i{display:inline-block;width:12px;height:12px;border-radius:50%;border:3px solid;margin-left:6px}
.cg-leg i.fica{border-color:#1f9d55}.cg-leg i.sai{border-color:#d64545;background:#f3c1bd}.cg-leg i.chega{border-color:#2f6fd0;background:#dbe8fb}.cg-leg i.def{border-color:#9aa0ab}
.cg-leg i.vc{border-color:#2f6fd0;background:#3b7fe0}.cg-leg i.vb{border-color:#2f8a3a;background:#3a9a46}
#cgWrap{overflow-x:auto}
#cg{min-width:760px;width:100%;margin:0 auto;background:#e9ede6;border-radius:12px;padding:12px 12px 8px}
.cg-campo{position:relative;width:100%;height:calc(100vh - 120px);min-height:480px;border:2px solid #fff;border-radius:6px;background:linear-gradient(135deg,#dfe6dc,#eef1ea 40%,#dfe6dc);overflow:hidden}
.cg-campo .l{position:absolute;border:2px solid rgba(255,255,255,.95)}
.cg-j{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;width:96px;max-width:150px;pointer-events:auto}
.cg-f{position:relative;width:54px;height:54px;border-radius:50%;background:#fff;border:3px solid #9aa0ab;overflow:visible;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.18)}
.cg-f img{width:100%;height:100%;border-radius:50%;object-fit:cover;object-position:top}
.cg-f span{font-family:var(--cond);font-weight:800;color:#6f7482;font-size:16px}
.cg-j.fica .cg-f{border-color:#1f9d55}
.cg-j.sai .cg-f{border-color:#d64545;background:#f3c1bd}.cg-j.sai .cg-f img{opacity:.75}
.cg-j.chega .cg-f{border-color:#2f6fd0;background:#dbe8fb}
.cg-tag-ch{margin-top:1px;background:#2f6fd0;color:#fff;border-radius:3px;font:700 8.5px/1 -apple-system,Arial,sans-serif;letter-spacing:.2px;padding:2px 4px;white-space:nowrap}
.cg-f.vaga{border:0;cursor:pointer}.cg-f.contratacao{background:#3b7fe0}.cg-f.base{background:#3a9a46}
.cg-ac{display:none;position:absolute;left:50%;top:100%;margin-top:1px;transform:translateX(-50%);gap:2px;z-index:4;white-space:nowrap}
.cg-j:hover .cg-ac{display:flex}
.cg-ac button{border:1px solid #c9ccd4;background:#fff;color:#5b6070;border-radius:4px;font:700 10px/1 -apple-system,Arial,sans-serif;padding:3px 6px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.cg-ac button.f:hover,.cg-ac button.f.on{background:#1f9d55;border-color:#1f9d55;color:#fff}
.cg-ac button.s:hover,.cg-ac button.s.on{background:#d64545;border-color:#d64545;color:#fff}
.cg-tipo{margin-top:1px;border:0;background:#d64545;color:#fff;border-radius:3px;font:700 8.5px/1 -apple-system,Arial,sans-serif;letter-spacing:.2px;padding:2px 4px;cursor:pointer;white-space:nowrap}
#cg.foto .cg-tipo{cursor:default}
#cg.foto .cg-ac{display:none}
.cg-j.c2 .cg-f{width:48px;height:48px}
.cg-j.c2 .cg-n{font-size:11px}
.cg-j[draggable=true]{cursor:grab}
.cg-j.arrastando{opacity:.35}
.cg-j.alvo .cg-f{box-shadow:0 0 0 4px #e8c84a}
.cg-add.alvo{border-color:#e8c84a;background:#fbf0c4}
.cg-x{display:none;position:absolute;right:-8px;top:-8px;width:20px;height:20px;border-radius:50%;border:0;background:#d64545;color:#fff;font-size:14px;line-height:20px;font-weight:700;cursor:pointer;padding:0;z-index:3;box-shadow:0 1px 4px rgba(0,0,0,.3)}
.cg-j:hover .cg-x{display:block}.cg-j:hover{z-index:5}
#cg.foto .cg-x{display:none!important}
.cg-b{position:absolute;right:-7px;top:-5px;font-style:normal;font-size:14px;line-height:1}
.cg-n{margin-top:3px;font-family:var(--cond);font-weight:800;font-size:12px;line-height:1.1;letter-spacing:-.1px;color:#17181c;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center;text-shadow:0 0 3px #fff,0 0 3px #fff}
.cg-add{position:absolute;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;border:1.5px dashed #8a8f9c;background:rgba(255,255,255,.6);color:#6f7482;cursor:pointer;font-size:13px;line-height:1}
.cg-add:hover{border-color:#15161a;color:#15161a}
#cg.foto .cg-add{display:none}
.cg-rod{display:flex;justify-content:space-between;align-items:center;margin-top:7px;color:#17181c;font-family:var(--cond);font-weight:800;letter-spacing:.4px;text-transform:uppercase;font-size:14px}
.cg-rod img{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px}
.cg-rod span:last-child{color:#6f7482;font-size:12px}
</style>
</head>

/* ═══ extensão (SofaScore) ═══ */
function extPedido(msg,limite=40000){
  return new Promise((res,rej)=>{
    if(!(window.chrome&&chrome.runtime&&chrome.runtime.connect)) return rej(new Error('sem extensão'));
    let port; try{ port=chrome.runtime.connect(RJ_EXT_ID,{name:'planejador'}); }catch(e){ return rej(new Error('sem extensão')); }
    const id=Date.now()+Math.random(); let fim=false;
    const t=setTimeout(()=>{ if(!fim){fim=true;try{port.disconnect()}catch(e){} rej(new Error('a extensão não respondeu'));} },limite);
    port.onMessage.addListener(m=>{ if(m.id!==id||m.log) return; fim=true; clearTimeout(t); try{port.disconnect()}catch(e){} m.erro?rej(new Error(m.erro)):res(m); });
    port.onDisconnect.addListener(()=>{ void chrome.runtime.lastError; if(!fim){fim=true;clearTimeout(t);rej(new Error('sem extensão'));} });
    port.postMessage({id,...msg});
  });
}
const sofa=async c=>JSON.parse((await extPedido({tipo:'baixar',url:'https://www.sofascore.com/api/v1'+c,como:'json'})).texto);
async function checarExtensao(){
  try{ await extPedido({tipo:'ping'},4000); EXT=true; }catch(e){ EXT=false; }
  document.getElementById('avisos').innerHTML=EXT?'':`<div class="aviso">Para buscar elencos, fotos e contratações no SofaScore, este Chrome precisa da extensão <b>BFR Relatório Jogadores</b> (1.5.1). <a href="${EXT_ZIP}">Baixe aqui</a>. As decisões já salvas aparecem sem ela.</div>`;
  return EXT;
}

/* ═══ fotos (SofaScore → Firebase, para todos verem sem a extensão) ═══ */
const FILA=[]; let rodando=0;
function foto(chave,url){
  if(FOTOS[chave]!==undefined) return FOTOS[chave];
  FOTOS[chave]=''; if(EXT){ FILA.push([chave,url]); andarFila(); }
  return '';
}
async function andarFila(){
  while(rodando<4&&FILA.length){
    const [k,u]=FILA.shift(); rodando++;
    (async()=>{ try{ const d=(await extPedido({tipo:'baixar',url:u,como:'bytes'})).dataurl||''; if(d){ FOTOS[k]=d; if(db) db.ref('planejador_fotos/'+k).set(d); agendar(); } }catch(e){} rodando--; andarFila(); })();
  }
}

async function iniciar(){
  document.getElementById('selLiga').innerHTML=LIGAS.map(([u,n])=>`<option value="${u}">${n}</option>`).join('');
  const q=new URLSearchParams(location.search);
  let salvo={}; try{ salvo=JSON.parse(localStorage.getItem('planejador_ult')||'{}'); }catch(e){}
  LIGA=+(q.get('liga')||salvo.liga||325);
  const timeId=+(q.get('time')||salvo.time||1958);
  document.getElementById('selLiga').value=LIGA;
  try{
    firebase.initializeApp(FIREBASE_CONFIG); await firebase.auth().signInAnonymously(); db=firebase.database();
    document.getElementById('infoBanco').textContent='● salvo para a equipe';
  }catch(e){ console.error(e); document.getElementById('infoBanco').textContent='⚠ sem conexão com o banco'; }
  await checarExtensao();
  await carregarTimes(LIGA,timeId);
  abrirTime(timeId);
}
async function carregarTimes(ut,escolher){
  const sel=document.getElementById('selClube');
  let lista=TIMES[ut];
  if(!lista&&db){ lista=(await db.ref('planejador_ligas/'+ut).once('value')).val(); }
  if(!lista&&EXT){
    try{ log('SofaScore: clubes da liga…');
      const s=(await sofa(`/unique-tournament/${ut}/seasons`)).seasons[0];
      const st=await sofa(`/unique-tournament/${ut}/season/${s.id}/standings/total`);
      const m=new Map(); (st.standings||[]).forEach(g=>g.rows.forEach(r=>m.set(r.team.id,r.team.name)));
      lista={temporada:s.id,times:[...m].map(([id,nome])=>({id,nome})).sort((a,b)=>a.nome.localeCompare(b.nome))};
      if(db) db.ref('planejador_ligas/'+ut).set(lista); log('');
    }catch(e){ log('⚠ não deu para listar os clubes: '+e.message); }
  }
  if(!lista) lista={times:ut===325?[{id:1958,nome:'Botafogo'}]:[]};
  TIMES[ut]=lista;
  sel.innerHTML=lista.times.map(t=>`<option value="${t.id}">${esc(t.nome)}</option>`).join('');
  if(escolher&&lista.times.some(t=>t.id===escolher)) sel.value=escolher;
  return lista;
}
async function trocarLiga(ut){ LIGA=+ut; const l=await carregarTimes(LIGA); if(l.times.length) abrirTime(l.times[0].id); }
function trocarClube(id){ abrirTime(+id); }
function abrirTime(id){
  const t=(TIMES[LIGA]?.times||[]).find(x=>x.id===id)||{id,nome:''};
  TIME=t; try{ localStorage.setItem('planejador_ult',JSON.stringify({liga:LIGA,time:id})); }catch(e){}
  document.getElementById('selClube').value=id;

  P={elenco:{}}; render();

  REF.on('value',async s=>{
    P=s.val()||{elenco:{}}; P.elenco=P.elenco||{};

      const ids=Object.keys(P.elenco).filter(k=>/^\d+$/.test(k)).concat(['t'+id]);
      await Promise.all(ids.filter(k=>FOTOS[k]===undefined).map(async k=>{ const v=(await db.ref('planejador_fotos/'+k).once('value')).val(); if(v) FOTOS[k]=v; }));
      if(!Object.keys(P.elenco).length) importarElenco(true);
    }
    render();
  });
}
const gravar=(caminho,valor)=>db?db.ref(`planejador/${TIME.id}/${caminho}`).set(valor):Promise.resolve(alert('Sem conexão com o banco: a mudança não foi salva.'));

/* ═══ elenco do SofaScore ═══ */
function setorDe(pd,pos){
  const p=(pd||[])[0]||'';
  if(p==='GK'||pos==='G') return 'GOL';
  if(['DL','DR','WBL','WBR'].includes(p)) return 'LAT';
  if(p==='DC') return 'ZAG';
  if(p==='DM') return 'VOL';
  if(p==='MC') return (pd||[]).includes('DM')?'VOL':'MEI';
  if(p==='AM') return 'MEI';
  if(['LW','RW','ML','MR'].includes(p)) return 'PON';
  if(p==='ST') return 'ATA';
  return {D:'ZAG',M:'MEI',F:'ATA'}[pos]||'MEI';
}
async function importarElenco(auto){
  if(!TIME) return;
  if(!await checarExtensao()){ if(!auto) alert('Precisa da extensão BFR Relatório Jogadores (link no aviso amarelo).'); return; }
  log(`SofaScore: elenco do ${TIME.nome||'clube'}…`);
  try{
    const j=await sofa(`/team/${TIME.id}/players`);
    const ps=(j.players||[]).map(x=>x.player).filter(p=>!p.team||p.team.id===TIME.id);
    const upd={}; let novos=0;
    for(const p of ps){
      const k=String(p.id), ant=(P.elenco||{})[k];
      const base={id:p.id,nome:p.name,curto:p.shortName||'',nac:(p.country&&p.country.alpha2)||'',posDet:p.positionsDetailed||[],pos:p.position||'',nasc:p.dateOfBirthTimestamp?isoTs(p.dateOfBirthTimestamp):'',
        contrato:p.contractUntilTimestamp?isoTs(p.contractUntilTimestamp):'',valor:p.proposedMarketValue||0,origem:ant?.origem||'elenco'};
      if(!ant){ base.setor=setorDe(p.positionsDetailed,p.position); novos++; upd[`elenco/${k}`]=base; }
      else Object.entries(base).forEach(([c,v])=>upd[`elenco/${k}/${c}`]=v);
    }
    upd.atualizado=new Date().toISOString(); upd.clube=TIME.nome||''; upd.liga=LIGA;
    if(db) await db.ref('planejador/'+TIME.id).update(upd); else { ps.forEach(p=>P.elenco[p.id]={...(P.elenco[p.id]||{}),...upd['elenco/'+p.id]}); render(); }
    log(auto?'':`✓ elenco atualizado (${ps.length} jogadores${novos?', '+novos+' novos':''})`);
  }catch(e){ log('⚠ '+e.message); if(!auto) alert('Não deu para buscar o elenco: '+e.message); }
}
/* Elenco atual = jogadores que aparecem na página do clube no Wyscout (pedido do Henrique, 26/10).
   lista: [{nome:'N. Ferraresi', ano:1998, grupo:'DEF'|'GKP'|'MID'|'FWD'|'', jogos}] — casa com o SofaScore por
   sobrenome + ano de nascimento (+ inicial). Quem só está no SofaScore sai do elenco atual (dá para voltar);
   quem só está no Wyscout entra à mão. */
const semAc=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9 .]/g,' ').replace(/\s+/g,' ').trim();
async function aplicarWyscout(lista){
  const sofaJ=Object.values(P.elenco||{}).filter(j=>j.origem!=='chegada'&&/^\d+$/.test(String(j.id))&&!j.incluidoAMao);
  if(sofaJ.length<10) throw new Error('o elenco do SofaScore ainda não carregou: espere a página abrir e tente de novo');
  const usados=new Set(), casou={}, faltam=[];
  for(const w of lista){
    const tk=semAc(w.nome).replace(/\./g,' ').split(' ').filter(Boolean), ult=tk[tk.length-1], ini=tk.length>1&&tk[0].length===1?tk[0]:'';
    let c=sofaJ.filter(j=>!usados.has(String(j.id))&&String(j.nasc||'').slice(0,4)==String(w.ano)&&semAc(j.nome).split(' ').includes(ult));
    if(c.length>1&&ini) c=c.filter(j=>semAc(j.nome).split(' ').some(t=>t.startsWith(ini)));
    if(c.length>1&&tk.length===1) c=c.filter(j=>semAc(j.nome).split(' ')[0]===ult);
    if(c.length===1){ usados.add(String(c[0].id)); casou[c[0].id]=w; } else faltam.push(w);
  }
  const upd={}, SET={GKP:'GOL',DEF:'ZAG',MID:'MEI',FWD:'ATA'};
  sofaJ.forEach(j=>{ const k=String(j.id); if(casou[k]){ upd[`elenco/${k}/removido`]=null; upd[`elenco/${k}/foraWyscout`]=null; upd[`elenco/${k}/wy`]={nome:casou[k].nome,jogos:casou[k].jogos||0}; }
    else { upd[`elenco/${k}/removido`]=true; upd[`elenco/${k}/foraWyscout`]=true; } });
  faltam.forEach((w,i)=>{ const id='w'+semAc(w.nome).replace(/[^a-z0-9]/g,'')+w.ano; if(P.elenco[id]) return;
    upd['elenco/'+id]={id,nome:w.nome,setor:SET[w.grupo]||'MEI',origem:'elenco',nasc:w.ano?w.ano+'-07-01':'',posDet:[],valor:0,manual:true,soWyscout:true,wy:{nome:w.nome,jogos:w.jogos||0}}; });
  upd.wyscout={em:new Date().toISOString(),total:lista.length,casados:Object.keys(casou).length,soWyscout:faltam.map(w=>w.nome)};
  await db.ref('planejador/'+TIME.id).update(upd);
  return {casados:Object.keys(casou).length,soWyscout:faltam.map(w=>w.nome+' ('+w.ano+')'),foraWyscout:sofaJ.filter(j=>!casou[j.id]).map(j=>j.nome)};
}
/* ═══ visões salvas (26/10): o cenário inteiro (fica/sai, chegadas, posições, vagas e escalação) guardado com um nome,
   para comparar alternativas e voltar a qualquer uma. Ficam em planejador_visoes/<clube>/<id>, para a equipe toda. ═══ */
const CAMPOS_VISAO=['elenco','vagas','esquema','escalacao','campoSai','mostraRes'];
async function janelaVisoes(){
  if(!db){ alert('Sem conexão com o banco.'); return; }
  const v=(await db.ref('planejador_visoes/'+TIME.id).once('value')).val()||{};
  const L=Object.entries(v).sort((a,b)=>String(b[1].em).localeCompare(String(a[1].em)));
  const c=contagem();
  document.getElementById('camada').innerHTML=`<div class="fundo" onclick="if(event.target===this)fecharPop()"><div class="jan">
    <h3>Visões · <span>${esc(TIME?.nome||'')}</span><button class="x" onclick="fecharPop()">×</button></h3>
    <div style="color:var(--txt2);font-size:12.5px;margin:4px 0 10px">Guarda o cenário de agora (quem fica, quem sai, chegadas, posições no campograma, vagas e escalação) com um nome. Abrir uma visão troca o planejamento atual por ela, para a equipe toda.</div>
    <div class="linha"><input id="vNome" placeholder="nome da visão (ex: Cenário A — venda do Cabral)" onkeydown="if(event.key==='Enter')salvarVisao()"><button class="btn ouro" onclick="salvarVisao()">💾 Salvar a atual</button></div>
    <div style="color:var(--txt3);font-size:11.5px;margin:-2px 0 10px">Agora: elenco <b style="color:#fff">${c.total}</b> · ficam <b style="color:var(--fica)">${c.fica}</b> · saem <b style="color:var(--sai)">${c.sai}</b> · chegam <b style="color:var(--chega)">${c.chega}</b></div>
    <div class="res">${L.length?L.map(([id,x])=>`<div class="it" style="cursor:default"><div class="q"><b>${esc(x.nome)}</b><small>${new Date(x.em).toLocaleString('pt-BR',{dateStyle:'short',timeStyle:'short'})} · elenco ${x.resumo?.total??'—'} · saem ${x.resumo?.sai??'—'} · chegam ${x.resumo?.chega??'—'}</small></div>
      <div style="display:flex;gap:6px"><button class="btn ouro" onclick="abrirVisao('${id}')">Abrir</button><button class="btn" onclick="regravarVisao('${id}')" title="Troca o conteúdo desta visão pelo planejamento de agora">Atualizar</button><button class="btn" onclick="apagarVisao('${id}')" title="Apagar esta visão">✕</button></div></div>`).join(''):'<div class="vaz">Nenhuma visão salva ainda.</div>'}</div>
  </div></div>`;
  setTimeout(()=>document.getElementById('vNome')?.focus(),50);
}
function fotoVisao(){ const d={}; CAMPOS_VISAO.forEach(k=>{ if(P[k]!==undefined) d[k]=P[k]; }); return JSON.parse(JSON.stringify(d)); }
async function salvarVisao(){
  const nome=document.getElementById('vNome').value.trim(); if(!nome){ alert('Dê um nome para a visão.'); return; }
  const c=contagem();
  await db.ref('planejador_visoes/'+TIME.id).push({nome,em:new Date().toISOString(),dados:fotoVisao(),resumo:{total:c.total,sai:c.sai,chega:c.chega,fica:c.fica}});
  janelaVisoes();
}
async function regravarVisao(id){
  if(!confirm('Trocar o conteúdo desta visão pelo planejamento de agora?')) return;
  const c=contagem();
  await db.ref(`planejador_visoes/${TIME.id}/${id}`).update({em:new Date().toISOString(),dados:fotoVisao(),resumo:{total:c.total,sai:c.sai,chega:c.chega,fica:c.fica}});
  janelaVisoes();
}
async function abrirVisao(id){
  const x=(await db.ref(`planejador_visoes/${TIME.id}/${id}`).once('value')).val(); if(!x) return;
  if(!confirm(`Abrir "${x.nome}"? O planejamento atual será trocado por esta visão (salve antes, se quiser guardar o de agora).`)) return;
  const upd={}; CAMPOS_VISAO.forEach(k=>upd[k]=(x.dados||{})[k]??null);
  upd.visaoAberta={id,nome:x.nome,em:new Date().toISOString()};
  await db.ref('planejador/'+TIME.id).update(upd);
  fecharPop();
}
async function apagarVisao(id){ if(!confirm('Apagar esta visão? (o planejamento atual não muda)')) return; await db.ref(`planejador_visoes/${TIME.id}/${id}`).remove(); janelaVisoes(); }

function recomecar(){
  if(!confirm(`Apagar todas as decisões do ${TIME?.nome||'clube'} (fica, sai, chegadas, apelidos, mudanças de setor e escalação)? Vale para a equipe toda.`)) return;

/* ═══ decisões ═══ */
function jogadores(){ return Object.values(P.elenco||{}).filter(j=>!j.removido); }
function status(j){ return j.origem==='chegada'?'chega':(j.status||''); }
function marcar(k,st){ const j=P.elenco[k]; gravar(`elenco/${k}/status`,j.status===st?null:st); if(st==='sai'&&!j.saida) gravar(`elenco/${k}/saida`,'venda'); }
function tipoSaida(k,t){ gravar(`elenco/${k}/saida`,t); }
function menu(ev,k){
  ev.stopPropagation(); const j=P.elenco[k];
  const c=document.getElementById('camada'), r=ev.currentTarget.getBoundingClientRect();
  c.innerHTML=`<div class="pop" style="left:${Math.min(r.left,innerWidth-210)}px;top:${r.bottom+4}px" onclick="event.stopPropagation()">
    <button onclick="apelido('${k}')">✎ Apelido no planejamento</button>
    <div class="t">Posição no campograma</div>
    <div style="display:flex;flex-wrap:wrap;gap:3px;padding:2px 6px 4px">${ZONAS.map(([z,n])=>`<button style="width:auto;padding:3px 7px;border:1px solid #e3e5ea;${zonaDe(j)===z?'background:#15161a;color:#fff':''}" title="${n}" onclick="campoZona('${k}','${z}')">${z}</button>`).join('')}</div>
    <div class="t">Mover para</div>
    ${SETORES.filter(([s])=>s!==j.setor).map(([s,n])=>`<button onclick="mover('${k}','${s}')">${n}</button>`).join('')}
    <div class="t"></div>
    ${j.origem==='chegada'?`<button class="vm" onclick="tirar('${k}')">✕ Desfazer contratação</button>`:`<button class="vm" onclick="tirar('${k}')">✕ Excluir do elenco atual</button>`}
  </div>`;
  setTimeout(()=>document.addEventListener('click',fecharPop,{once:true}),0);

function fecharPop(){ document.getElementById('camada').innerHTML=''; }
function apelido(k){ fecharPop(); const v=prompt('Nome que aparece no planejamento:',P.elenco[k].apelido||P.elenco[k].nome); if(v!==null) gravar(`elenco/${k}/apelido`,v.trim()||null); }
function mover(k,s){ fecharPop(); gravar(`elenco/${k}/setor`,s); }
function tirar(k){ fecharPop(); const j=P.elenco[k]; if(j.origem==='chegada'){ if(confirm(`Desfazer a contratação de ${j.nome}?`)) gravar(`elenco/${k}`,null); } else gravar(`elenco/${k}/removido`,true); }
const nomeDe=j=>j.apelido||j.nome;

/* ═══ tela: elenco ═══ */
function aba(a){ ABA=a; [['abaE','elenco'],['abaC','campo'],['abaX','esc']].forEach(([i,v])=>document.getElementById(i).classList.toggle('on',a===v)); render(); }
function contagem(){
  const js=jogadores(), c={fica:0,sai:0,chega:0,def:0,total:0};
  js.forEach(j=>{ const s=status(j); if(s==='fica')c.fica++; else if(s==='sai')c.sai++; else if(s==='chega')c.chega++; else c.def++; });
  c.total=js.length-c.sai; c.atual=js.filter(j=>j.origem!=='chegada').length; return c;
}
function cabecalho(){
  const c=contagem(), esc_=fotoTime(TIME?.id);
  return `<div class="clube">${esc_?`<img src="${esc_}" alt="">`:''}<div><h1>${esc(TIME?.nome||P.clube||'')} <span>${ANO}</span></h1>
    <div class="sub">${esc((LIGAS.find(l=>l[0]===LIGA)||[])[1]||'')} · elenco atual com <b>${c.atual}</b> jogadores${P.wyscout?' (lista do Wyscout de '+new Date(P.wyscout.em).toLocaleDateString('pt-BR')+')':''}${P.atualizado?' · SofaScore em '+new Date(P.atualizado).toLocaleDateString('pt-BR'):''}</div></div>

const CAIXA_SETOR={GOL:'GOL',LE:'LAT',LD:'LAT',ZC:'ZAG',ZD:'ZAG',MED:'VOL',VOL:'VOL',MEI:'MEI',EE:'PON',ED:'PON',ATA:'ATA'};

  }).join('');

  const ex=Object.values(P.elenco||{}).filter(j=>j.removido&&j.origem!=='chegada')

async function ctObs(d){

let SCOUT_LISTA=null;
const IND_SETOR={'1':'GOL','2':'LAT','3':'LAT','4':'ZAG','5':'VOL','6':'MEI','7':'MEI','8':'PON','9':'ATA'};
function setorIndicado(x){
  const c=String(x.posicao||'').trim()[0]; if(IND_SETOR[c]) return IND_SETOR[c];
  const t=String(x.posicao||x.posicaoText||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
  if(/goleir|\bgk\b/.test(t)) return 'GOL'; if(/lateral|\b(lb|rb|ld|le)\b/.test(t)) return 'LAT'; if(/zag|\bcb\b/.test(t)) return 'ZAG';
  if(/volan|\bdm\b/.test(t)) return 'VOL'; if(/extrem|ponta|\b(rw|lw)\b/.test(t)) return 'PON'; if(/meia|medio|meio|\b(cm|am)\b/.test(t)) return 'MEI';
  if(/ataca|centroav|\b(cf|st)\b/.test(t)) return 'ATA'; return '';
}
async function ctScout(f){

      SCOUT_LISTA.sort((a,b)=>String(b.data).localeCompare(String(a.data))); }

async function ctEscolher(p){

/* ═══ campograma (pedido do Brunno, 26/10): o elenco inteiro no campo deitado, por posição ═══
   Ataque para a direita: lado esquerdo do time em cima. Contorno verde = fica, vermelho = sai, dourado = chega,
   cinza = a definir. Vagas "Contratação" e "Base" marcadas por posição (P.vagas). */
const ZONAS=[['GOL','Goleiros'],['ZAG','Zagueiros'],['LE','Lateral esquerdo'],['LD','Lateral direito'],['VOL','Volantes'],['MC','Meio-campistas'],['MO','Meias ofensivos'],['PE','Ponta esquerda'],['PD','Ponta direita'],['ATA','Atacantes']];
// col = coluna em pé (x fixo, centrada em y) · row = linha deitada (y fixo, centrada em x)
const ZONA_POS={GOL:['col',6,55],ZAG:['col',21,54],LE:['row',27,10],LD:['row',34,91],VOL:['col',37,55],MC:['col',51,52],MO:['col',65,55],PE:['row',72,10],PD:['row',67,91],ATA:['col',93,54]};
const BANDEIRA=a=>a&&a.length===2&&a.toUpperCase()!=='BR'?String.fromCodePoint(...[...a.toUpperCase()].map(c=>127397+c.charCodeAt(0))):'';
function zonaDe(j){
  if(j.campo) return j.campo;
  const pd=(j.posDet||[]).join(' '), lado=ladoDe(j);
  switch(j.setor){
    case 'GOL': return 'GOL'; case 'ZAG': return 'ZAG'; case 'VOL': return 'VOL'; case 'ATA': return 'ATA';
    case 'LAT': return lado==='D'?'LD':'LE';
    case 'PON': return lado==='D'?'PD':'PE';
    case 'MEI': return /\bAM\b/.test(pd)&&!/\bMC\b/.test(pd.split(' ')[0])?'MO':'MC';
  }
  return 'MC';
}
function menuCampo(ev,k){
  ev.stopPropagation(); const j=P.elenco[k]; if(!j) return;
  const s=status(j), r=ev.currentTarget.getBoundingClientRect(), chega=j.origem==='chegada';
  const b=(on,txt,fn,cor)=>`<button onclick="${fn}" style="${on?`background:${cor};color:#fff;font-weight:700`:''}">${txt}</button>`;
  document.getElementById('camada').innerHTML=`<div class="pop" style="left:${Math.min(r.right+4,innerWidth-220)}px;top:${Math.min(r.top,innerHeight-380)}px;min-width:210px" onclick="event.stopPropagation()">
    <div class="t" style="color:#17181c;font-size:12px;letter-spacing:0;text-transform:none">${esc(j.nome)}${chega?' · chega':''}</div>
    ${chega?`<div style="padding:4px 9px;color:#8a8f9c">Contratação planejada${j.clubeOrigem?' (de '+esc(j.clubeOrigem)+')':''}</div>`:
      b(s==='fica','✓ Fica',`campoStatus('${k}','fica')`,'#1f9d55')+
      `<div class="t">Sai</div>`+SAIDAS.map(([t,n])=>b(s==='sai'&&(j.saida||'venda')===t,'↗ Sai · '+({venda:'venda',emprestimo:'empréstimo',fim:'fim de contrato'})[t],`campoStatus('${k}','sai','${t}')`,'#d64545')).join('')+
      b(!s,'○ A definir',`campoStatus('${k}','')`,'#6f7482')}
    <div class="t">Posição no campograma</div>
    <div style="display:flex;flex-wrap:wrap;gap:3px;padding:2px 6px 4px">${ZONAS.map(([z,n])=>`<button style="width:auto;padding:3px 7px;border:1px solid #e3e5ea;${zonaDe(j)===z?'background:#15161a;color:#fff':''}" title="${n}" onclick="campoZona('${k}','${z}')">${z}</button>`).join('')}</div>
    <div class="t"></div>
    <button onclick="fecharPop();apelido('${k}')">✎ Apelido</button>
    <button class="vm" onclick="fecharPop();apagarCampo('${k}')">✕ ${chega?'Desfazer contratação':'Excluir do elenco atual'}</button>
  </div>`;
  setTimeout(()=>document.addEventListener('click',fecharPop,{once:true}),0);
}
// botões direto no campograma: Fica / Sai e, quando sai, o tipo (venda, empréstimo, fim de contrato)
/* arrastar e soltar (como ícones no celular): soltar em cima de outro jogador ocupa o lugar dele e empurra os demais;
   soltar no ＋ de uma posição leva para o fim dela. Grava a ordem (e a posição no campograma) de todos daquela posição. */
let ARR=null;
function arrIni(ev){ ARR=ev.currentTarget.dataset.id; ev.dataTransfer.effectAllowed='move'; try{ ev.dataTransfer.setData('text/plain',ARR); }catch(e){} ev.currentTarget.classList.add('arrastando'); fecharPop(); }
function arrSobre(ev){ if(!ARR) return; ev.preventDefault(); ev.dataTransfer.dropEffect='move'; ev.currentTarget.classList.add('alvo'); }
function arrFim(){ ARR=null; document.querySelectorAll('.cg-j.arrastando,.alvo').forEach(e=>e.classList.remove('arrastando','alvo')); }
function arrSolta(ev){
  ev.preventDefault(); ev.stopPropagation();
  const de=ARR, alvo=ev.currentTarget, z=alvo.dataset.z, para=alvo.dataset.id||null; arrFim();
  if(!de||!z||de===para) return;
  // ordem atual da posição de destino, como está na tela
  const atual=[...document.querySelectorAll('#cg .cg-j[data-z="'+z+'"]')].map(e=>e.dataset.id).filter(id=>id!==de);
  let i=para?atual.indexOf(para):atual.length; if(i<0) i=atual.length;
  const naTela=[...document.querySelectorAll('#cg .cg-j[data-z="'+z+'"]')].map(e=>e.dataset.id);
  if(para&&naTela.indexOf(de)>-1&&naTela.indexOf(de)<naTela.indexOf(para)) i++;   // vindo de antes, entra depois do alvo (troca natural)
  atual.splice(i,0,de);
  const upd={}; atual.forEach((id,n)=>upd[`elenco/${id}/ordem`]=n);
  upd[`elenco/${de}/campo`]=z;
  db.ref('planejador/'+TIME.id).update(upd);
}
function nomeCampo(j){ const n=nomeDe(j); return j.apelido||n.length<=15?n:curto(n); }
function acoesCampo(j,s){
  const k=j.id, p=(c,on,txt,st,tit)=>`<button class="${c}${on?' on':''}" title="${tit}" onclick="event.stopPropagation();campoStatus('${k}','${st}')">${txt}</button>`;
  return `<div class="cg-ac">${p('f',s==='fica','Fica',s==='fica'?'':'fica','Fica')}${p('s',s==='sai','Sai',s==='sai'?'':'sai','Sai')}</div>`;
}
// etiqueta do tipo de saída (clique troca: venda → empréstimo → fim de contrato)
function tipoCampo(j){
  const t=j.saida||'venda', ord=SAIDAS.map(x=>x[0]), prox=ord[(ord.indexOf(t)+1)%ord.length];
  return `<button class="cg-tipo" title="Sai por ${({venda:'venda',emprestimo:'empréstimo',fim:'fim de contrato'})[t]} · clique para trocar" onclick="event.stopPropagation();campoStatus('${j.id}','sai','${prox}')">${({venda:'VENDA',emprestimo:'EMPRÉSTIMO',fim:'FIM DE CONTRATO'})[t]} ▸</button>`;
}
function campoStatus(k,st,tipo){
  fecharPop();
  gravar(`elenco/${k}/status`,st||null);
  if(st==='sai') gravar(`elenco/${k}/saida`,tipo||P.elenco[k]?.saida||'venda');
}
function apagarCampo(k){
  const j=P.elenco[k]; if(!j) return;
  if(j.origem==='chegada'){ if(confirm(`Desfazer a contratação de ${nomeDe(j)}?`)) gravar(`elenco/${k}`,null); return; }
  if(confirm(`Excluir ${nomeDe(j)} do elenco atual? Ele vai para "Fora do elenco atual" (aba Elenco), de onde dá para voltar.`)) gravar(`elenco/${k}/removido`,true);
}
const ZONA_SETOR={GOL:'GOL',ZAG:'ZAG',LE:'LAT',LD:'LAT',VOL:'VOL',MC:'MEI',MO:'MEI',PE:'PON',PD:'PON',ATA:'ATA'};
function contratarNoCampo(z,modo){ CT={setor:ZONA_SETOR[z]||'MEI',aba:modo==='elenco'?'busca':'listas',modo,campo:z}; janelaContratar(); }
function campoZona(k,z){ fecharPop(); gravar(`elenco/${k}/campo`,z); }
function vaga(z,tipo,d){ const v=((P.vagas||{})[z]||{})[tipo]||0; gravar(`vagas/${z}/${tipo}`,Math.max(0,v+d)||null); }
function menuVaga(ev,z){
  ev.stopPropagation(); const r=ev.currentTarget.getBoundingClientRect();
  document.getElementById('camada').innerHTML=`<div class="pop" style="left:${Math.min(r.left,innerWidth-210)}px;top:${r.bottom+4}px" onclick="event.stopPropagation()">
    <div class="t">${(ZONAS.find(x=>x[0]===z)||[])[1]}</div>
    <button onclick="fecharPop();contratarNoCampo('${z}','chegada')"><b>🔎 Contratar jogador</b> <span style="color:#8a8f9c">(digitar o nome)</span></button>
    <button onclick="fecharPop();contratarNoCampo('${z}','elenco')">🔎 Incluir no elenco atual</button>
    <div class="t">Só marcar a vaga</div>
    <button onclick="fecharPop();vaga('${z}','contratacao',1)">＋ Vaga de contratação</button><button onclick="fecharPop();vaga('${z}','base',1)">＋ Vaga para a base</button></div>`;
  setTimeout(()=>document.addEventListener('click',fecharPop,{once:true}),0);
}
function telaCampograma(){
  const mostraSai=P.campoSai!==false;
  const js=jogadores().filter(j=>mostraSai||status(j)!=='sai');
  const por={}; ZONAS.forEach(([z])=>por[z]=[]);
  js.forEach(j=>por[zonaDe(j)].push(j));
  const peso={fica:0,chega:1,'':2,sai:3};
  const itens=[];
  ZONAS.forEach(([z])=>{
    // atuais primeiro (ordem fixa: marcar fica/sai não muda o lugar), contratações depois, na ordem em que entraram
    const L=por[z].sort((a,b)=>((a.ordem??1e6)-(b.ordem??1e6))||((a.origem==='chegada')-(b.origem==='chegada'))||(a.origem==='chegada'?String(a.criadoEm||'').localeCompare(String(b.criadoEm||'')):((b.valor||0)-(a.valor||0))||nomeDe(a).localeCompare(nomeDe(b))))
      .map(j=>({j})).concat(Array.from({length:((P.vagas||{})[z]||{}).contratacao||0},()=>({vaga:'contratacao'})),Array.from({length:((P.vagas||{})[z]||{}).base||0},()=>({vaga:'base'})));
    const [tipo,x,y]=ZONA_POS[z], n=L.length;
    if(tipo==='col'){
      const cols=n>7?2:1, porCol=Math.ceil(n/cols), passo=Math.min(13,72/Math.max(porCol-1,1));
      L.forEach((it,i)=>{ const c=Math.floor(i/porCol), r=i%porCol, nn=c<cols-1?porCol:n-porCol*(cols-1);
        itens.push({...it,z,c2:cols>1,w:cols>1?7.5:11,x:x+(cols>1?(c?3.8:-3.8):0),y:y+(r-(nn-1)/2)*passo}); });
    } else {
      const passo=Math.min(7.4,40/Math.max(n,1));
      L.forEach((it,i)=>itens.push({...it,z,w:passo*.96,x:x+(i-(n-1)/2)*passo,y}));
    }
    // botão "+" (vaga): na coluna, ao lado do primeiro jogador; na linha, no fim dela
    if(tipo==='col'){ const cols=n>7?2:1, porCol=Math.max(1,Math.ceil(n/cols)), passo=Math.min(13,72/Math.max(porCol-1,1));
      itens.push({add:z,x:x+(cols>1?7.2:3.8),y:n?y-((porCol-1)/2)*passo:y}); }
    else itens.push({add:z,x:x+(n?((n-1)/2)*Math.min(7.4,40/Math.max(n,1))+4.6:0),y});
  });
  const html=itens.map(it=>{
 if(it.add) return `<button class="cg-add" data-z="${it.add}" ondragover="arrSobre(event)" ondragleave="this.classList.remove('alvo')" ondrop="arrSolta(event)" style="left:${it.x}%;top:${it.y}%" onclick="menuVaga(event,'${it.add}')" title="Marcar vaga de contratação ou de base">＋</button>`;
    if(it.vaga) return `<div class="cg-j" style="left:${it.x}%;top:${it.y}%;width:${it.w}%"><div class="cg-f vaga ${it.vaga}" onclick="vaga('${it.z}','${it.vaga}',-1)" title="Clique para tirar a vaga"></div><div class="cg-n">${it.vaga==='base'?'BASE':'CONTRATAÇÃO'}</div></div>`;
    const j=it.j, s=status(j), f=fotoJog(j.id), aa=j.nasc?String(j.nasc).slice(2,4):'', bd=BANDEIRA(j.nac);
    return `<div class="cg-j ${s||'def'}${it.c2?' c2':''}" draggable="true" data-id="${j.id}" data-z="${it.z}" ondragstart="arrIni(event)" ondragover="arrSobre(event)" ondragleave="this.classList.remove('alvo')" ondrop="arrSolta(event)" ondragend="arrFim()" onclick="menuCampo(event,'${j.id}')" style="left:${it.x}%;top:${it.y}%;width:${it.w}%;cursor:pointer" title="${esc(j.nome)} · ${s==='sai'?'sai'+(j.saida?' ('+j.saida+')':''):s||'a definir'}">
      <div class="cg-f">${f?`<img src="${f}" alt="">`:`<span>${iniciais(nomeDe(j))}</span>`}${bd?`<i class="cg-b">${bd}</i>`:''}<button class="cg-x" onclick="event.stopPropagation();apagarCampo('${j.id}')" title="${j.origem==='chegada'?'Desfazer a contratação':'Excluir do elenco atual'}">×</button></div>
      <div class="cg-n">${esc(nomeCampo(j))}${aa?` (${aa})`:''}</div>${s==='sai'?tipoCampo(j):s==='chega'?'<span class="cg-tag-ch">CONTRATAÇÃO</span>':''}${j.origem==='chegada'?'':acoesCampo(j,s)}</div>`;
  }).join('');
  const c=contagem(), esc_=fotoTime(TIME?.id);
  document.getElementById('barraExtra').innerHTML=`<label class="chk" style="margin:0"><input type="checkbox" ${mostraSai?'checked':''} onchange="gravar('campoSai',this.checked)"> Quem sai</label>
      <span class="cg-leg"><i class="fica"></i>Fica <i class="sai"></i>Sai <i class="chega"></i>Chega <i class="def"></i>A definir <i class="vc"></i>Contratação <i class="vb"></i>Base</span>
      <span class="dica" title="Arraste o jogador para mudar a ordem ou a posição (solte em cima de outro ou no ＋) · Mouse no jogador: Fica / Sai · clique no jogador: posição, apelido ou excluir · etiqueta vermelha: troca o tipo de saída · ＋: contratar ou marcar vaga">ⓘ</span>
      <button class="btn" onclick="baixarCampograma()">⬇ Imagem</button>`;
  return `<div id="cgWrap"><div id="cg"><div class="cg-campo">
      <div class="l" style="left:50%;top:0;bottom:0;border-width:0 0 0 2px"></div><div class="l" style="left:50%;top:50%;height:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)"></div>
      <div class="l" style="left:0;top:22%;bottom:22%;width:15%;border-left:0"></div><div class="l" style="right:0;top:22%;bottom:22%;width:15%;border-right:0"></div>
      <div class="l" style="left:0;top:37%;bottom:37%;width:5%;border-left:0"></div><div class="l" style="right:0;top:37%;bottom:37%;width:5%;border-right:0"></div>
      ${html}</div>
      <div class="cg-rod"><span>${esc_?`<img src="${esc_}" alt="">`:''}${esc(TIME?.nome||'')} <b>${ANO}</b> · elenco <b>${c.total}</b> · saem <b style="color:#c23b3b">${c.sai}</b> · chegam <b style="color:#b8860b">${c.chega}</b></span><span>Scout System · Botafogo</span></div></div></div>`;
}
async function baixarCampograma(){
  const el=document.getElementById('cg'); if(!el||!window.html2canvas){ alert('Não deu para gerar a imagem.'); return; }
  el.classList.add('foto');
  try{ const c=await html2canvas(el,{backgroundColor:'#e9ede6',scale:2});
    const a=document.createElement('a'); a.download=`Campograma_${(TIME?.nome||'elenco').replace(/\s+/g,'_')}_${ANO}.png`; a.href=c.toDataURL('image/png'); a.click(); }
  finally{ el.classList.remove('foto'); }
}

/* ═══ escalação ═══ */
// x: 0 = esquerda, 100 = direita; y: 0 = ataque (alto), 100 = gol. lado: D direita, E esquerda.
const ESQUEMAS={
  '4-3-3':[['GOL',50,90],['LAT',85,70,'D'],['ZAG',62,75],['ZAG',38,75],['LAT',15,70,'E'],['VOL',50,56],['MEI',72,44],['MEI',28,44],['PON',84,20,'D'],['ATA',50,13],['PON',16,20,'E']],
  '4-2-3-1':[['GOL',50,90],['LAT',85,70,'D'],['ZAG',62,75],['ZAG',38,75],['LAT',15,70,'E'],['VOL',64,56],['VOL',36,56],['PON',84,34,'D'],['MEI',50,37],['PON',16,34,'E'],['ATA',50,12]],
  '4-4-2':[['GOL',50,90],['LAT',85,70,'D'],['ZAG',62,75],['ZAG',38,75],['LAT',15,70,'E'],['VOL',62,52],['VOL',38,52],['PON',86,40,'D'],['PON',14,40,'E'],['ATA',63,15],['ATA',37,15]],
  '4-3-1-2':[['GOL',50,90],['LAT',85,70,'D'],['ZAG',62,75],['ZAG',38,75],['LAT',15,70,'E'],['VOL',50,58],['MEI',74,49],['MEI',26,49],['MEI',50,35],['ATA',64,14],['ATA',36,14]],
  '4-1-4-1':[['GOL',50,90],['LAT',85,70,'D'],['ZAG',62,75],['ZAG',38,75],['LAT',15,70,'E'],['VOL',50,59],['MEI',64,43],['MEI',36,43],['PON',86,35,'D'],['PON',14,35,'E'],['ATA',50,12]],
  '3-5-2':[['GOL',50,90],['ZAG',74,73],['ZAG',50,77],['ZAG',26,73],['LAT',88,46,'D'],['VOL',50,57],['MEI',68,42],['MEI',32,42],['LAT',12,46,'E'],['ATA',63,15],['ATA',37,15]],
  '3-4-3':[['GOL',50,90],['ZAG',74,73],['ZAG',50,77],['ZAG',26,73],['LAT',88,48,'D'],['VOL',62,52],['VOL',38,52],['LAT',12,48,'E'],['PON',80,20,'D'],['ATA',50,13],['PON',20,20,'E']],
  '5-3-2':[['GOL',50,90],['LAT',89,62,'D'],['ZAG',72,74],['ZAG',50,77],['ZAG',28,74],['LAT',11,62,'E'],['VOL',50,55],['MEI',70,42],['MEI',30,42],['ATA',63,15],['ATA',37,15]]};
const SIGLA_SLOT={GOL:'GOL',LAT:'LAT',ZAG:'ZAG',VOL:'VOL',MEI:'MEI',PON:'PON',ATA:'ATA'};
const ladoDe=j=>{ const p=(j.posDet||[]).join(' '); return /\b(DR|RW|MR|WBR)\b/.test(p)?'D':/\b(DL|LW|ML|WBL)\b/.test(p)?'E':''; };
function disponiveis(){ return jogadores().filter(j=>status(j)!=='sai'); }
function autoEscalar(esq){
  const slots=ESQUEMAS[esq], usados=new Set(), disp=disponiveis().sort((a,b)=>(b.valor||0)-(a.valor||0)), out=[];
  for(let r=0;r<3;r++) slots.forEach(([g,,,lado],i)=>{
    const ok=j=>!usados.has(String(j.id))&&j.setor===g;
    const c=disp.find(j=>ok(j)&&(!lado||ladoDe(j)===lado))||disp.find(ok);
    out[i]=out[i]||[]; out[i][r]=c?String(c.id):''; if(c) usados.add(String(c.id));
  });
  return out;
}
function escAtual(){
  const esq=P.esquema||'4-3-3'; let e=(P.escalacao||{})[esq];
  const ids=new Set(disponiveis().map(j=>String(j.id)));
  if(!e) e=autoEscalar(esq);
  e=ESQUEMAS[esq].map((_,i)=>[0,1,2].map(r=>{ const v=(e[i]||[])[r]||''; return ids.has(v)?v:''; }));
  return {esq,e};
}
function setEsquema(s){ gravar('esquema',s); }
function setSlot(i,r,v){ const {esq,e}=escAtual(); e[i][r]=v; gravar('escalacao/'+esq,e); }
function reEscalar(){ const esq=P.esquema||'4-3-3'; gravar('escalacao/'+esq,autoEscalar(esq)); }
function telaEscalacao(){
  const {esq,e}=escAtual(), mostra=P.mostraRes!==false, J=P.elenco||{};
  const disp=disponiveis().sort((a,b)=>SETORES.findIndex(s=>s[0]===a.setor)-SETORES.findIndex(s=>s[0]===b.setor)||nomeDe(a).localeCompare(nomeDe(b)));
  const opc=v=>`<option value="">—</option>`+SETORES.map(([s,n])=>`<optgroup label="${n}">${disp.filter(j=>j.setor===s).map(j=>`<option value="${j.id}" ${String(j.id)===v?'selected':''}>${esc(nomeDe(j))}${status(j)==='chega'?' (chega)':''}</option>`).join('')}</optgroup>`).join('');
  const slots=ESQUEMAS[esq].map(([g,x,y],i)=>{ const [t,r1,r2]=e[i], j=J[t]; const f=j?fotoJog(j.id):'';
    return `<div class="slot" style="left:${100-y}%;top:${x}%">${j?(f?`<img class="fto ${status(j)==='chega'?'chega':''}" src="${f}" alt="">`:`<div class="fto ${status(j)==='chega'?'chega':''}">${iniciais(nomeDe(j))}</div>`):`<div class="fto">${g}</div>`}
      <div class="ti">${j?esc(curto(nomeDe(j))):'—'}</div>${mostra?[r1,r2].filter(v=>J[v]).map(v=>`<div class="rs">${esc(curto(nomeDe(J[v])))}</div>`).join(''):''}</div>`; }).join('');
  const escudo=fotoTime(TIME?.id);
  return `<div class="esc"><div id="campoWrap"><div id="campo">
      <div class="gram"><div class="l" style="top:0;bottom:0;left:50%;border-width:0 0 0 2px"></div><div class="l" style="left:50%;top:50%;height:26%;aspect-ratio:1;border-radius:50%;transform:translate(-50%,-50%)"></div>
        <div class="l" style="top:22%;bottom:22%;left:0;width:15%;border-left:0"></div><div class="l" style="top:22%;bottom:22%;right:0;width:15%;border-right:0"></div>${slots}</div>
      <div class="rodape-campo"><span style="color:var(--txt3);font-size:13px">Scout System · Botafogo</span><span>${escudo?`<img src="${escudo}" alt="">`:''}${esc(TIME?.nome||'')} <b>${ANO}</b> · ${esq}</span></div>
    </div></div>
    <div class="painel"><h4>Esquema</h4><div class="esqs">${Object.keys(ESQUEMAS).map(s=>`<button class="${s===esq?'on':''}" onclick="setEsquema('${s}')">${s}</button>`).join('')}</div>
      <label class="chk"><input type="checkbox" ${mostra?'checked':''} onchange="gravar('mostraRes',this.checked)"> Mostrar reservas no campo</label>
      <div style="display:flex;gap:6px;margin-bottom:10px"><button class="btn" onclick="reEscalar()" title="Refaz titulares e reservas pelo setor de cada jogador (quem sai fica de fora)">↺ Montar automático</button><button class="btn ouro" onclick="baixarImagem()">⬇ Imagem</button></div>
      <h4>Titulares e reservas</h4>
      ${ESQUEMAS[esq].map(([g],i)=>`<div class="pos"><span class="p">${SIGLA_SLOT[g]}</span>${[0,1,2].map(r=>`<select class="${r?'':'t'}" onchange="setSlot(${i},${r},this.value)">${opc(e[i][r])}</select>`).join('')}</div>`).join('')}
    </div></div>`;
}
async function baixarImagem(){
  const el=document.getElementById('campo'); if(!el||!window.html2canvas){ alert('Não deu para gerar a imagem.'); return; }
  const c=await html2canvas(el,{backgroundColor:'#101114',scale:2});
  const a=document.createElement('a'); a.download=`${(TIME?.nome||'elenco').replace(/\s+/g,'_')}_${ANO}_${(P.esquema||'4-3-3')}.png`; a.href=c.toDataURL('image/png'); a.click();
}

function render(){ document.body.classList.toggle('campo',ABA==='campo'); document.getElementById('barraExtra').innerHTML=''; document.getElementById('tela').innerHTML=ABA==='elenco'?telaElenco():ABA==='campo'?telaCampograma():telaEscalacao(); }
iniciar();
